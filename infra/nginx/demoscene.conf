server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /srv/demoscene/current;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
        add_header Cache-Control "no-store";
    }

    location /catalog/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /media/ {
        location ~* \.m3u8$ {
            try_files $uri =404;
            default_type application/vnd.apple.mpegurl;
            add_header Cache-Control "public, max-age=60";
            add_header Access-Control-Allow-Origin "*" always;
        }

        location ~* \.ts$ {
            try_files $uri =404;
            default_type video/mp2t;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }

        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /artwork/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        return 404;
    }

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4 m4s;
        application/json json;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
    }

    sendfile on;
    tcp_nopush on;
    etag on;
    gzip on;
    gzip_types application/json application/vnd.apple.mpegurl text/plain;
}
